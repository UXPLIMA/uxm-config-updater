name: 'Build and Test'

permissions:
  contents: 'read'

on:
  pull_request:
  push:
    branches: [ 'main' ]
  workflow_call:

jobs:
  build:
    name: 'Build and Test'
    # Public repository: GitHub-hosted, so a pull request from a fork never reaches our runners.
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4

      - name: 'Validate Gradle Wrapper'
        uses: gradle/actions/wrapper-validation@v4

      - name: 'Set up JDK 21'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: 'Setup Gradle'
        uses: gradle/actions/setup-gradle@v4

      - name: 'Run Build & Tests'
        run: sh gradlew clean build test

      - name: 'Upload library jar'
        uses: actions/upload-artifact@v4
        with:
          name: 'library-jars'
          path: build/libs/ConfigUpdater-*.jar
          if-no-files-found: 'error'
