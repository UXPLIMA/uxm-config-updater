name: 'Release Pipeline'

on:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build-and-test:
    name: 'Build and Test'
    uses: ./.github/workflows/build-and-test.yml

  attach-to-release:
    name: 'Attach to Release'
    needs: [ build-and-test ]
    runs-on: ubuntu-latest

    steps:
      - name: 'Download library jars'
        uses: actions/download-artifact@v4
        with:
          name: 'library-jars'
          path: 'release-files'

      - name: 'Check the files carry the release version'
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG_NAME#v}"
          pattern="-v?${version//./\\.}\.jar$"
          status=0
          while IFS= read -r file; do
            name="$(basename "$file")"
            if [[ ! "$name" =~ $pattern ]]; then
              echo "::error::$name is not version $version. Set the version in the build to $version before tagging."
              status=1
            fi
          done < <(find release-files -type f)
          exit $status

      - name: 'Upload to the release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: find release-files -type f -exec gh release upload "$TAG_NAME" {} --clobber --repo "$GITHUB_REPOSITORY" \;

  publish-maven:
    name: 'Publish to Maven'
    needs: [ attach-to-release ]
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4

      - name: 'Validate Gradle Wrapper'
        uses: gradle/actions/wrapper-validation@v4

      - name: 'Set up JDK 21'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: 'Setup Gradle'
        uses: gradle/actions/setup-gradle@v4

      - name: 'Publish to Uxplima Nexus (maven-publish)'
        env:
          UXPLIMA_NEXUS_USER: ${{ secrets.UXPLIMA_NEXUS_USER }}
          UXPLIMA_NEXUS_PASS: ${{ secrets.UXPLIMA_NEXUS_PASS }}
        run: sh gradlew publish
