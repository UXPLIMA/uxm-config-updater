plugins {
    id 'java'
    id 'maven-publish'
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'com.uxplima'
            artifactId = 'configupdater'
            version = '1.3.3'

            from components.java
        }
    }

    repositories {
        maven {
            def snapshot = project.version.endsWith('SNAPSHOT')
            def releaseUrl = 'https://repo.uxplima.com/repository/maven-releases/'
            def snapshotUrl = 'https://repo.uxplima.com/repository/maven-snapshots/'

            name = 'uxplima-nexus'
            url = uri(snapshot ? snapshotUrl : releaseUrl)

            credentials {
                username = findProperty('uxplimaNexusUser') ?: System.getenv('UXPLIMA_NEXUS_USER')
                password = findProperty('uxplimaNexusPass') ?: System.getenv('UXPLIMA_NEXUS_PASS')
            }
        }
    }
}

group = 'com.uxplima'
version = '1.3.3'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:1.20.6-R0.1-SNAPSHOT")
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
